# nginx.conf — static host config for the cloned `dist/` bundle.
#
# Used by templates/Dockerfile (copied to /etc/nginx/conf.d/default.conf). The
# cloned page is a single static Vite route, so the only real requirement is:
# serve the hashed asset files directly, and fall back to index.html for any
# unknown path (so deep links / refreshes resolve). Deterministic; no LLM.

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip the text-ish responses; assets are already minified by Vite.
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml font/woff2;

    # Vite emits content-hashed filenames under /assets — safe to cache hard.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # SPA fallback: serve the file if it exists, else index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
