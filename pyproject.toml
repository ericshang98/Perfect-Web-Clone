[project]
name = "perfect-web-clone"
version = "3.0.0"
description = "Pixel-perfect clones of any webpage. Paste a URL, get a measured Vite + React replica."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Perfect Web Clone" }]
keywords = ["web-clone", "pixel-perfect", "playwright"]
dependencies = [
    "pydantic>=2.5.0",
    "playwright>=1.44.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "pillow>=10.3.0",
    "lxml>=5.2.0",
    "scikit-image>=0.22.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
pwc = "pwc.cli:main"

[project.urls]
Homepage = "https://github.com/ericshang98/Perfect-Web-Clone"
Skill = "https://github.com/ericshang98/perfect-web-clone-skill"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pwc", "core", "mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100
